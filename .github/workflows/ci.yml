name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Biome check
        run: bunx @biomejs/biome check .
      - name: Vitest
        run: bunx vitest run
      - name: Astro check
        run: bunx astro check
      - name: Build
        run: bunx astro build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
      - name: Seed local D1
        run: |
          for f in drizzle/0*.sql; do
            bunx wrangler d1 execute shirankedo --local --file="$f"
          done
          bunx wrangler d1 execute shirankedo --local --file=e2e/seed.sql
      - name: E2E tests
        run: bunx playwright test
