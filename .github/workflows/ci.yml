name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome check
        run: npx @biomejs/biome check .
      - name: Vitest
        run: npx vitest run
      - name: Astro check
        run: npx astro check
      - name: Build
        run: npx astro build
