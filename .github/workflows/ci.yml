name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome check
        run: npx @biomejs/biome check .
      - name: Vitest
        run: npx vitest run
      - name: Astro check
        run: npx astro check
      - name: Build
        run: npx astro build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Seed local D1
        run: |
          for f in drizzle/0*.sql; do
            npx wrangler d1 execute shirankedo --local --file="$f"
          done
          npx wrangler d1 execute shirankedo --local --file=e2e/seed.sql
      - name: E2E tests
        run: npx playwright test
