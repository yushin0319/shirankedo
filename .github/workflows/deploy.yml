name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: wrangler deploy (with Sentry release tag)
        run: bunx wrangler deploy --var SENTRY_RELEASE:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          for url in \
            "https://shirankedo.y-fudo.workers.dev/" \
            "https://shirankedo.y-fudo.workers.dev/ai" \
            "https://shirankedo.y-fudo.workers.dev/trend"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$status" -ne 200 ]; then
              echo "FAIL: $url returned $status"
              exit 1
            fi
            echo "OK: $url → $status"
          done
      - name: Notify obs-notify on failure
        if: failure()
        run: |
          curl -s -X POST "$N8N_WEBHOOK_URL/obs-notify" \
            -H "Content-Type: application/json" \
            -d '{"severity":"warning","service":"github-actions","repo":"shirankedo","subject":"⚠ shirankedo デプロイ失敗","summary":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
